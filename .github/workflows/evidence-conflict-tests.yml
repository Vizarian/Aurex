name: Aurex evidence conflict tests
on:
  push:
    paths:
      - 'evidence_conflicts.py'
      - 'tests/test_evidence_conflicts.py'
      - '.github/workflows/evidence-conflict-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_evidence_conflicts.py' -v
