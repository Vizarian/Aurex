name: Aurex retry guard tests
on:
  push:
    paths:
      - 'experiments/retry_guard.py'
      - 'tests/test_retry_guard.py'
      - '.github/workflows/retry-guard-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_retry_guard.py' -v
