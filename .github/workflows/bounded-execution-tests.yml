name: Aurex bounded execution tests
on:
  push:
    paths:
      - 'experiments/retry_guard.py'
      - 'experiments/execute_next_action.py'
      - 'tests/test_bounded_execution.py'
      - '.github/workflows/bounded-execution-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_bounded_execution.py' -v
