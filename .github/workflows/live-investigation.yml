name: Aurex live investigation
on:
  push:
    paths:
      - 'experiments/live_investigator.py'
      - '.github/workflows/live-investigation.yml'
  workflow_dispatch:
  schedule:
    - cron: '7 */6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: aurex-live-investigation
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect live Actions failures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m experiments.live_investigator
      - name: Choose next action from observed failures
        run: python -m experiments.next_action
      - name: Execute chosen read-only diagnostic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m experiments.execute_next_action
      - name: Choose fallback after live diagnostic
        run: python -m experiments.fallback_policy
      - name: Upload observed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-investigation-report
          path: |
            receipts/live-investigation.json
            receipts/next-action.json
            receipts/executed-action.json
            receipts/fallback-decision.json
          if-no-files-found: warn
