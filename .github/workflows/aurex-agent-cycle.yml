name: Aurex agent cycle
on:
  push:
    paths:
      - 'aurex_runner.py'
      - 'aurex_core/**'
      - '.github/workflows/aurex-agent-cycle.yml'
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aurex-agent-cycle
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and offline tests
        run: |
          python -m compileall -q aurex_runner.py aurex_core tests
          python -m unittest discover -s tests -v
      - name: Run bounded offline cycle
        run: python aurex_runner.py
      - name: Verify persisted cycle receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('state/agent/last_run.json').read_text())
          assert receipt['outbound_sent'] == 0
          assert receipt['verification']['journal_contains_processed_events']
          assert receipt['verification']['drafts_only']
          print('AUREX_CYCLE_VERIFIED')
          PY
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/agent
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist Aurex cycle"
            git push
          fi
