name: Aurex AI issue agent
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'aurex_ai_agent.py'
      - '.github/workflows/aurex-ai.yml'
permissions:
  contents: read
  issues: write
  models: read
concurrency:
  group: aurex-ai-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  analyze:
    if: github.event_name == 'issues' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate agent
        run: python -m py_compile aurex_ai_agent.py
      - name: Confirm runtime and permissions
        run: |
          echo "event=${{ github.event_name }} repository=${{ github.repository }}"
          python --version
      - name: Analyze issue with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUREX_MODEL: openai/gpt-4o-mini
          AUREX_ISSUE_NUMBER: '5'
        run: python aurex_ai_agent.py
