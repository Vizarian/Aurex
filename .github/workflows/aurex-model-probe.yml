name: Aurex OpenAI connectivity test (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurex-model-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One bounded API test
        run: python model_probe.py
