name: Aurex offline PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all tracked Python files
        run: |
          git ls-files -z '*.py' | xargs -0 -r python -m py_compile
      - name: Full offline test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
