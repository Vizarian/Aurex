name: Aurex heartbeat (safe mode)
on:
  push:
    paths:
      - 'heartbeat.py'
      - '.github/workflows/aurex-heartbeat.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
concurrency:
  group: aurex-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run safe heartbeat
        run: python heartbeat.py
      - name: Persist verified state
        run: |
          git config user.name "aurex-heartbeat[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/heartbeat.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Aurex heartbeat"
            git push
          fi
