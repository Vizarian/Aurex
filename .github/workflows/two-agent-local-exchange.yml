name: Aurex two-agent local exchange (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-agent-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          python -m pip install --disable-pip-version-check huggingface_hub
      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build /tmp/llama.cpp/build --config Release -j 2 --target llama-cli
          mkdir -p receipts/two-agent
          git -C /tmp/llama.cpp rev-parse HEAD > receipts/two-agent/llama_cpp_commit.txt
      - name: Download model
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(repo_id="Qwen/Qwen2.5-0.5B-Instruct-GGUF", filename="qwen2.5-0.5b-instruct-q4_k_m.gguf", local_dir="/tmp/aurex-model"))
          PY
      - name: Run real two-agent exchange
        run: python experiments/two_agent_exchange.py
      - name: Upload exchange and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurex-two-agent-exchange
          path: receipts/two-agent/
          if-no-files-found: warn
          retention-days: 7
