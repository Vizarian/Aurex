name: Aurex offline code checks
on:
  push:
    paths:
      - 'model_probe.py'
      - 'seam_evaluator.py'
      - 'fixtures/**'
      - 'aurex_core/**'
      - 'tests/**'
      - '.github/workflows/aurex-code-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q model_probe.py seam_evaluator.py postmark_watcher.py aurex_core tests
      - name: Offline unit tests (no API key needed)
        run: |
          python -m unittest discover -s tests -v
          python seam_evaluator.py
